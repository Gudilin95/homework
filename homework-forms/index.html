<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Практика по формам</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <form>
      <fieldset class="fieldset">
        <h2>Ваши личные данные</h2>
        <label
          >Ваше имя<input class="blok" type="text" required placeholder="Имя"
        /></label>
        <label
          >Ваш возраст<input
            class="blok"
            type="number"
            required
            placeholder="Возраст"
        /></label>
        <label
          >Ваш номер телефона<input
            class="blok"
            type="tel"
            required
            placeholder="Номер телефона"
        /></label>
        <label
          >Ваша почта<input
            class="blok"
            type="email"
            required
            placeholder="Почта"
        /></label>
        <label
          >Сообщение
          <textarea
            class="blok"
            required
            placeholder="Ваше сообщение"
          ></textarea>
        </label>
        <label class="checkbox"
          ><input type="checkbox" required /> Я принимаю правила</label
        >
        <button class="button">Отправить</button>
      </fieldset>
    </form>
  </body>
</html>
